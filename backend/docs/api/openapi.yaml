openapi: 3.0.3
info:
  title: Pet-Spa API
  version: 1.0.0
  description: |
    API backend hệ thống quản lý spa thú cưng (ASP.NET Core Web API, JSON UTF-8).
    Căn cứ: System_Analysis_UI_Design v1.3 mục 5.1 (endpoint, request, response), Backend-Conventions 1.0, Authorization, Requirements v2, DatabaseDesign. Quy ước và điểm chưa chốt: xem API-Notes.md.

    Ký hiệu trong tài liệu này:
    - `x-roles`: vai trò được gọi — KH khách hàng, LT lễ tân, NVS nhân viên spa, QL quản lý. Ngoài vai trò, backend luôn kiểm tra sở hữu/phạm vi (BR-16).
    - `x-fr`: mã yêu cầu chức năng (FR).
    - `x-proposal: true`: nội dung đề xuất, chưa có trong SA 5.1, chờ nhóm duyệt.
    - Mọi endpoint có thể trả 500 (không lộ chi tiết nội bộ).
servers:
  - url: /api/v1
    description: Tiền tố /api/v1; HTTPS bắt buộc ở mọi môi trường.
security:
  - bearerAuth: []
tags:
  - name: Xác thực & tài khoản
  - name: Khách hàng
  - name: Thú cưng
  - name: Danh mục dịch vụ
  - name: Lịch hẹn – đặt lịch & truy vấn
  - name: Lịch hẹn – xác nhận, đổi, hủy
  - name: Lịch hẹn – thực hiện
  - name: Thanh toán
  - name: Lưu trú – chuồng & giá
  - name: Lịch làm việc, cấu hình, tác vụ nền
  - name: Nhân viên
  - name: Thông báo
paths:
  # ───────────── Xác thực & tài khoản ─────────────
  /auth/register:
    post:
      tags: ["Xác thực & tài khoản"]
      operationId: register
      summary: Đăng ký tài khoản khách hàng
      description: "Role luôn là Customer, không nhận từ client. Tạo AppUser và Customer; userName là số điện thoại."
      security: []
      x-roles: [Ẩn danh]
      x-fr: [FR-ACC-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Đã tạo tài khoản.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: "DUPLICATE_CONTACT — số điện thoại đã được dùng."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/login:
    post:
      tags: ["Xác thực & tài khoản"]
      operationId: login
      summary: Đăng nhập
      description: "Cấp access token và refresh token. Sai thông tin, tài khoản bị vô hiệu hóa (IsActive = false) đều trả 401, thông báo chung không nêu trường sai."
      security: []
      x-roles: [Ẩn danh]
      x-fr: [FR-ACC-02]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: ["Xác thực & tài khoản"]
      operationId: refreshToken
      summary: Làm mới token
      description: "Xoay vòng: thu hồi refresh token cũ, cấp cặp token mới. Từ chối nếu token đã thu hồi, hết hạn hoặc tài khoản bị vô hiệu hóa. Token đã thu hồi bị gửi lại → thu hồi mọi refresh token của tài khoản."
      security: []
      x-roles: ["Ẩn danh (refresh token)"]
      x-fr: ["Req. 5.2"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Cặp token mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: ["Xác thực & tài khoản"]
      operationId: logout
      summary: Đăng xuất
      description: Thu hồi refresh token.
      x-roles: [Đã đăng nhập]
      x-fr: ["Req. 5.2"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Đã thu hồi. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      tags: ["Xác thực & tài khoản"]
      operationId: getMe
      summary: Xem tài khoản của chính mình
      description: Tài khoản lấy từ token, không nhận id từ client.
      x-roles: [Đã đăng nhập]
      x-fr: [FR-ACC-03]
      responses:
        '200':
          description: Hồ sơ cá nhân.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: ["Xác thực & tài khoản"]
      operationId: updateMe
      summary: Cập nhật thông tin cá nhân của chính mình
      description: "`fullName` bắt buộc với KH và nhân viên; QL không có họ tên (AppUser không có cột này) nên bỏ qua. `phone` chỉ áp dụng cho KH: cập nhật cả Customer.Phone và AppUser.UserName trong một giao dịch; vai trò khác bỏ qua `phone` (nhân viên do QL quản lý ở PUT /staff/{id})."
      x-roles: [Đã đăng nhập]
      x-fr: [FR-ACC-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeRequest' }
      responses:
        '200': { description: Đã cập nhật. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: "DUPLICATE_CONTACT — thông tin liên hệ trùng."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  # ───────────── Khách hàng ─────────────
  /customers:
    get:
      tags: ["Khách hàng"]
      operationId: listCustomers
      summary: Tìm khách theo thông tin liên hệ / xem khách bị khóa
      description: "LT tìm khách theo `search`. QL chỉ xem danh sách khách bị khóa tự đặt lịch (FR-BOOK-07)."
      x-roles: [LT, "QL (chỉ khách bị khóa)"]
      x-fr: [FR-ACC-04, FR-BOOK-07]
      parameters:
        - name: search
          in: query
          description: Thông tin liên hệ cần tìm.
          schema: { type: string }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Danh sách khách.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /customers/walk-in:
    post:
      tags: ["Khách hàng"]
      operationId: createWalkInCustomer
      summary: Ghi nhận khách vãng lai
      description: "Tạo Customer với UserId = NULL (không đăng nhập, không nhận thông báo). Từ chối nếu trùng liên hệ."
      x-roles: [LT]
      x-fr: [FR-ACC-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalkInRequest' }
      responses:
        '201':
          description: Đã ghi nhận.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalkInCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: "DUPLICATE_CONTACT — thông tin liên hệ đã thuộc khách hiện có."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /customers/{id}/unlock-booking:
    post:
      tags: ["Khách hàng"]
      operationId: unlockBooking
      summary: Gỡ khóa quyền tự đặt lịch trực tuyến
      description: Đặt IsBookingLocked = false (BR-15).
      x-roles: [QL]
      x-fr: [FR-BOOK-07]
      parameters:
        - { $ref: '#/components/parameters/CustomerId' }
      responses:
        '204': { description: Đã gỡ khóa. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "CUSTOMER_NOT_LOCKED (đề xuất) — khách không ở trạng thái bị khóa."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  # ───────────── Thú cưng ─────────────
  /pets:
    post:
      tags: ["Thú cưng"]
      operationId: createPet
      summary: Tạo hồ sơ thú cưng
      description: "Hệ thống xác định SizeGroup theo SizeRule (BR-19); bỏ qua nhóm do client gửi. LT bắt buộc kèm `customerId`; KH tạo cho chính mình (bỏ qua `customerId`). `heightCm` bắt buộc khi species = Dog."
      x-roles: ["KH (của mình)", "LT (kèm customerId)"]
      x-fr: [FR-PET-01, FR-PET-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetRequest' }
      responses:
        '201':
          description: Đã tạo hồ sơ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetSizeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: ["Thú cưng"]
      operationId: listPets
      summary: Danh sách hồ sơ thú cưng đang hoạt động
      description: "KH: của mình. LT: theo `customerId`."
      x-roles: ["KH (của mình)", "LT (?customerId)"]
      x-fr: [FR-PET-02]
      parameters:
        - name: customerId
          in: query
          description: Chỉ dùng cho LT.
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Danh sách hồ sơ đang hoạt động (IsActive = true).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pets/{id}:
    parameters:
      - { $ref: '#/components/parameters/PetId' }
    get:
      tags: ["Thú cưng"]
      operationId: getPet
      summary: Xem hồ sơ thú cưng trong phạm vi
      description: "KH: của mình. LT: toàn cửa hàng. NVS: thú cưng của lịch hẹn được phân công. QL: toàn cửa hàng."
      x-roles: ["KH (của mình)", LT, "NVS (lịch được phân công)", QL]
      x-fr: [FR-PET-02]
      responses:
        '200':
          description: Hồ sơ thú cưng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: ["Thú cưng"]
      operationId: updatePet
      summary: Cập nhật hồ sơ thú cưng
      description: "Body như POST /pets (`customerId` bị bỏ qua). Hệ thống xác định lại SizeGroup."
      x-roles: ["KH (của mình)", LT]
      x-fr: [FR-PET-02, FR-PET-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetRequest' }
      responses:
        '200':
          description: Đã cập nhật.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetSizeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: ["Thú cưng"]
      operationId: deletePet
      summary: Gỡ bỏ hồ sơ thú cưng
      description: "BR-25: chưa từng có lịch hẹn → xóa hẳn; đã có lịch hẹn → xóa mềm (IsActive = false)."
      x-roles: ["KH (của mình)"]
      x-fr: [FR-PET-03]
      responses:
        '204': { description: Đã gỡ bỏ. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ───────────── Danh mục dịch vụ ─────────────
  /services:
    get:
      tags: ["Danh mục dịch vụ"]
      operationId: listServices
      summary: Xem dịch vụ đang cung cấp
      description: "Dịch vụ đang cung cấp kèm giá, thời lượng, số nhân viên theo loài và nhóm kích cỡ; lọc `pricing` theo `species`, `sizeGroup` nếu có. QL nhận cả dịch vụ đã ngừng (`isActive = false`) để mở lại (đề xuất)."
      x-roles: [Đã đăng nhập]
      x-fr: [FR-SVC-04]
      parameters:
        - name: species
          in: query
          schema: { $ref: '#/components/schemas/Species' }
        - name: sizeGroup
          in: query
          schema: { $ref: '#/components/schemas/SizeGroup' }
      responses:
        '200':
          description: Danh sách dịch vụ (rỗng nếu không có).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Service' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: ["Danh mục dịch vụ"]
      operationId: createService
      summary: Thêm dịch vụ
      description: "Kèm mốc giờ bắt đầu muộn nhất (thuộc Booking.SlotTimes) và dòng giá, thời lượng, số nhân viên cho đủ mọi nhóm kích cỡ của từng loài áp dụng; thiếu → 400."
      x-roles: [QL]
      x-fr: [FR-SVC-01]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRequest' }
      responses:
        '201':
          description: Đã thêm dịch vụ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /services/{id}:
    put:
      tags: ["Danh mục dịch vụ"]
      operationId: updateService
      summary: Sửa dịch vụ, loài, giá, thời lượng
      description: "Body như POST /services. Có hiệu lực ngay; khoảng giữ chỗ và số nhân viên của lịch đã đặt giữ giá trị đã chốt, khoản thanh toán chưa ghi nhận tính theo đơn giá hiện có (FR-PAY-01)."
      x-roles: [QL]
      x-fr: [FR-SVC-02]
      parameters:
        - { $ref: '#/components/parameters/ServiceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRequest' }
      responses:
        '200': { description: Đã cập nhật. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /services/{id}/status:
    patch:
      tags: ["Danh mục dịch vụ"]
      operationId: setServiceStatus
      summary: Ngừng / mở lại cung cấp dịch vụ
      x-roles: [QL]
      x-fr: [FR-SVC-03]
      parameters:
        - { $ref: '#/components/parameters/ServiceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActiveToggleRequest' }
      responses:
        '204': { description: Đã cập nhật. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ───────────── Lịch hẹn – đặt lịch & truy vấn ─────────────
  /spa/slots:
    get:
      tags: ["Lịch hẹn – đặt lịch & truy vấn"]
      operationId: getSpaSlots
      summary: Mốc giờ spa còn chỗ
      description: "Các mốc giờ trong Booking.SlotTimes (mặc định 09:00–19:00). Còn chỗ khi mốc không muộn hơn mốc bắt đầu muộn nhất của mọi dịch vụ đã chọn và E − Tải đỉnh ≥ n (BR-13, SA 2.3.3)."
      x-roles: [KH, LT]
      x-fr: [FR-BOOK-01, FR-BOOK-02]
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-10-06"
        - name: petId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: serviceIds
          in: query
          required: true
          description: Danh sách mã dịch vụ, phân cách bằng dấu phẩy.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Thời lượng, số nhân viên cần, thời gian dọn dẹp và trạng thái từng mốc giờ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaSlots' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /appointments/spa:
    post:
      tags: ["Lịch hẹn – đặt lịch & truy vấn"]
      operationId: createSpaAppointment
      summary: Tạo lịch spa "Chờ xác nhận"
      description: "KH tự đặt: thú cưng của mình, không bị khóa (BR-15). LT đặt thay: kèm `customerId`, không áp dụng khóa. Không chọn nhân viên (BR-10). Kiểm tra khả dụng và giữ chỗ trong một giao dịch có khóa (BR-18)."
      x-roles: ["KH (của mình)", "LT (thay)"]
      x-fr: [FR-BOOK-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaBookingRequest' }
      responses:
        '201':
          description: Đã tạo lịch hẹn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaBookingCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "FORBIDDEN (sai vai trò/ngoài phạm vi) hoặc BOOKING_LOCKED (KH tự đặt khi tài khoản bị khóa)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: "SLOT_FULL — mốc giờ đã kín (kể cả do đặt đồng thời)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /hotel/availability:
    get:
      tags: ["Lịch hẹn – đặt lịch & truy vấn"]
      operationId: getHotelAvailability
      summary: Còn chỗ lưu trú, số đêm, tiền tạm tính
      description: "Còn ít nhất một chuồng phù hợp loài, nhóm kích cỡ, trống trong toàn bộ các đêm (BR-21). Ngày trả phải sau ngày nhận."
      x-roles: [KH, LT, QL]
      x-fr: [FR-HTL-04]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: petId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Kết quả kiểm tra.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotelAvailability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /appointments/hotel:
    post:
      tags: ["Lịch hẹn – đặt lịch & truy vấn"]
      operationId: createHotelAppointment
      summary: Tạo lịch lưu trú "Chờ xác nhận"
      description: "Như đặt lịch spa về quyền và khóa (BR-15). Lưu trú không kèm spa."
      x-roles: ["KH (của mình)", "LT (thay)"]
      x-fr: [FR-HTL-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HotelBookingRequest' }
      responses:
        '201':
          description: Đã tạo lịch hẹn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotelBookingCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: "FORBIDDEN hoặc BOOKING_LOCKED (KH tự đặt khi tài khoản bị khóa)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '409':
          description: "NO_CAPACITY — hết chuồng phù hợp (kể cả do đặt đồng thời)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
  /appointments:
    get:
      tags: ["Lịch hẹn – đặt lịch & truy vấn"]
      operationId: listAppointments
      summary: Danh sách lịch hẹn, lịch sử, tổng quan tiến độ
      description: "Lọc theo phạm vi vai trò ở backend: KH của mình; LT, QL toàn cửa hàng; NVS được phân công / công việc của mình (BR-16)."
      x-roles: [KH, LT, NVS, QL]
      x-fr: [FR-BOOK-04, FR-BOOK-05, FR-EXE-01, FR-EXE-06, FR-EXE-08]
      parameters:
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/AppointmentType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AppointmentStatus' }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: petId
          in: query
          schema: { type: string, format: uuid }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Danh sách phân trang.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /appointments/{id}:
    parameters:
      - { $ref: '#/components/parameters/AppointmentId' }
    get:
      tags: ["Lịch hẹn – đặt lịch & truy vấn"]
      operationId: getAppointment
      summary: Chi tiết lịch hẹn
      description: Kiểm tra phạm vi theo id; ngoài phạm vi → 403, không trả thông tin (BR-16).
      x-roles: [KH, LT, NVS, QL]
      x-fr: [FR-BOOK-04]
      responses:
        '200':
          description: Chi tiết lịch hẹn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppointmentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: ["Lịch hẹn – xác nhận, đổi, hủy"]
      operationId: updateAppointment
      summary: Đổi lịch hẹn
      description: "Spa: `slotStart`, `petId`, `serviceIds`. Lưu trú: `plannedCheckIn`, `plannedCheckOut`, `petId`. KH đổi trong hạn Booking.ChangeCancelDeadlineMinutes → lịch về Pending, phân công/chuồng bị bỏ (BR-26). QL đổi vẫn kiểm tra BR-13, BR-04, BR-21; QL được gửi thêm `staffIds` (spa) hoặc `cageId` (lưu trú) và `confirmOutOfShift` để đổi nhân viên/chuồng (UC-15, đề xuất)."
      x-roles: ["KH (trong hạn)", QL]
      x-fr: [FR-CHG-01, FR-CHG-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAppointmentRequest' }
      responses:
        '200':
          description: "Đã đổi. KH đổi → status = Pending."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "CHANGE_WINDOW_CLOSED (quá hạn tự đổi, hướng dẫn hotline); SLOT_FULL; NO_CAPACITY; INVALID_TRANSITION; khi QL đổi nhân viên/chuồng: STAFF_CONFLICT, CAGE_CONFLICT, STAFF_COUNT_MISMATCH, STAFF_OUT_OF_SHIFT (đề xuất)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  # ───────────── Lịch hẹn – xác nhận, đổi, hủy ─────────────
  /appointments/{id}/suggestions:
    get:
      tags: ["Lịch hẹn – xác nhận, đổi, hủy"]
      operationId: getSuggestions
      summary: Đề xuất nhân viên (spa) hoặc chuồng (lưu trú)
      description: "Spa: đủ số nhân viên cần — nhân viên spa đang hoạt động, có ca phủ khoảng giữ chỗ, chưa có lịch trùng, xếp theo ít lịch nhất trong Suggest.LookbackDays ngày. Lưu trú: chuồng đang sử dụng, cùng loài và nhóm kích cỡ, không trùng đêm."
      x-roles: [QL]
      x-fr: [FR-ASG-01, FR-HTL-05]
      parameters:
        - { $ref: '#/components/parameters/AppointmentId' }
      responses:
        '200':
          description: Đề xuất.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/SpaSuggestions' }
                  - { $ref: '#/components/schemas/HotelSuggestions' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "INVALID_TRANSITION — lịch hẹn không ở Chờ xác nhận."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /appointments/{id}/confirm:
    post:
      tags: ["Lịch hẹn – xác nhận, đổi, hủy"]
      operationId: confirmAppointment
      summary: Xác nhận lịch hẹn kèm nhân viên hoặc chuồng
      description: "Spa: `staffIds` đủ số nhân viên cần. Lưu trú: `cageId`. Lịch từng do khách đổi → tính lại số tiền (BR-26). Chọn tay nhân viên ngoài ca mà chưa gửi `confirmOutOfShift = true` → 409 STAFF_OUT_OF_SHIFT kèm danh sách nhân viên (đề xuất, Backend-Conventions 5.4)."
      x-roles: [QL]
      x-fr: [FR-ASG-02, FR-ASG-03, FR-HTL-05]
      parameters:
        - { $ref: '#/components/parameters/AppointmentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: '#/components/schemas/ConfirmSpaRequest' }
                - { $ref: '#/components/schemas/ConfirmHotelRequest' }
      responses:
        '200':
          description: "Đã xác nhận (status = Confirmed)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "STAFF_CONFLICT; CAGE_CONFLICT; STAFF_COUNT_MISMATCH; INVALID_TRANSITION; STAFF_OUT_OF_SHIFT (đề xuất)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /appointments/{id}/reject:
    post:
      tags: ["Lịch hẹn – xác nhận, đổi, hủy"]
      operationId: rejectAppointment
      summary: Từ chối lịch hẹn (cửa hàng không thể đáp ứng)
      description: "Không có body. Lịch Pending → Cancelled, lý do StoreUnable; giải phóng phân công/chuồng."
      x-roles: [QL]
      x-fr: [FR-ASG-04, FR-HTL-06]
      parameters:
        - { $ref: '#/components/parameters/AppointmentId' }
      responses:
        '200':
          description: Đã từ chối.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RejectResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "INVALID_TRANSITION — lịch hẹn không ở Chờ xác nhận."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /appointments/{id}/cancel:
    post:
      tags: ["Lịch hẹn – xác nhận, đổi, hủy"]
      operationId: cancelAppointment
      summary: Hủy lịch hẹn
      description: "KH (trong hạn): không gửi `reason`, backend đặt CustomerCancelled. QL: gửi `reason` là StoreUnable hoặc CustomerBeyondDeadline, ở mọi trạng thái trước Completed. Ngoài hạn, KH bị chặn (CHANGE_WINDOW_CLOSED). Hủy khi InProgress/InStay: chỉ QL."
      x-roles: ["KH (trong hạn)", QL]
      x-fr: [FR-CHG-01, FR-CHG-02, FR-CHG-03]
      parameters:
        - { $ref: '#/components/parameters/AppointmentId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelRequest' }
      responses:
        '200':
          description: "Đã hủy (status = Cancelled)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "CHANGE_WINDOW_CLOSED; INVALID_TRANSITION."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  # ───────────── Lịch hẹn – thực hiện ─────────────
  /appointments/{id}/check-in:
    post:
      tags: ["Lịch hẹn – thực hiện"]
      operationId: checkInAppointment
      summary: Tiếp nhận thú cưng
      description: "Spa: body `{ actualWeightKg }`, chuyển Received và đối chiếu cân nặng (BR-23); chỉ hợp lệ khi chưa quá Booking.HoldMinutes sau giờ hẹn. Lưu trú: không body; yêu cầu đã đối chiếu cân nặng, không chờ xác nhận chi phí, tiền lưu trú đã thanh toán; chuyển InStay."
      x-roles: [LT, QL]
      x-fr: [FR-EXE-02, FR-HTL-07]
      parameters:
        - { $ref: '#/components/parameters/AppointmentId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualWeightRequest' }
      responses:
        '200':
          description: "Đã tiếp nhận. `weightCheck` chỉ có ở lịch spa."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckInResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "INVALID_TRANSITION; PAYMENT_NOT_DUE (lưu trú: chưa thanh toán tiền lưu trú); COST_CONFIRMATION_PENDING."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /appointments/{id}/weight-check:
    post:
      tags: ["Lịch hẹn – thực hiện"]
      operationId: weightCheckAppointment
      summary: Ghi nhận và đối chiếu cân nặng (lưu trú)
      description: "Thực hiện trước khi thu tiền lưu trú. Lịch Confirmed, thú cưng đã đến, chưa thu tiền lưu trú."
      x-roles: [LT, QL]
      x-fr: [FR-EXE-10]
      parameters:
        - { $ref: '#/components/parameters/AppointmentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualWeightRequest' }
      responses:
        '200':
          description: Kết quả đối chiếu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeightCheckResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "INVALID_TRANSITION."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /appointments/{id}/cost-confirmation/respond:
    post:
      tags: ["Lịch hẹn – thực hiện"]
      operationId: respondCostConfirmation
      summary: Xác nhận hoặc từ chối chi phí mới
      description: "Có yêu cầu Pending, chưa quá hạn CostConfirm.TimeoutMinutes. `accept = false` → lịch Cancelled, lý do CostNotConfirmed. LT ghi nhận thay khách vãng lai hoặc phản hồi trực tiếp."
      x-roles: ["KH (của mình)", "LT (thay)"]
      x-fr: [FR-EXE-11]
      parameters:
        - { $ref: '#/components/parameters/AppointmentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CostConfirmationRespondRequest' }
      responses:
        '200':
          description: Đã ghi nhận phản hồi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "COST_CONFIRMATION_EXPIRED (đề xuất) — phản hồi sau ExpiresAt. Không có yêu cầu Pending → 404."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /appointments/{id}/start:
    post:
      tags: ["Lịch hẹn – thực hiện"]
      operationId: startAppointment
      summary: Bắt đầu thực hiện lịch spa
      description: "Received → InProgress. Cần ảnh Before hợp lệ (BR-20) và không chờ xác nhận chi phí mới."
      x-roles: ["NVS (được phân công)", QL]
      x-fr: [FR-EXE-03, FR-EXE-05]
      parameters:
        - { $ref: '#/components/parameters/AppointmentId' }
      responses:
        '200':
          description: "status = InProgress."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "PHOTO_REQUIRED; COST_CONFIRMATION_PENDING; INVALID_TRANSITION."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /appointments/{id}/services/{serviceId}:
    patch:
      tags: ["Lịch hẹn – thực hiện"]
      operationId: updateServiceProgress
      summary: Đánh dấu dịch vụ trong lịch spa đã xong
      x-roles: ["NVS (được phân công)", QL]
      x-fr: [FR-EXE-03]
      parameters:
        - { $ref: '#/components/parameters/AppointmentId' }
        - { $ref: '#/components/parameters/ServiceIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceProgressRequest' }
      responses:
        '200': { description: Đã cập nhật. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "INVALID_TRANSITION."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /appointments/{id}/complete:
    post:
      tags: ["Lịch hẹn – thực hiện"]
      operationId: completeAppointment
      summary: Hoàn tất lịch spa
      description: "InProgress → Completed khi mọi dịch vụ đã xong (BR-06) và có ảnh After (BR-20). Hình thành khoản thanh toán Spa."
      x-roles: ["NVS (được phân công)", QL]
      x-fr: [FR-EXE-04, FR-EXE-05]
      parameters:
        - { $ref: '#/components/parameters/AppointmentId' }
      responses:
        '200':
          description: "status = Completed."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "PHOTO_REQUIRED; SERVICES_INCOMPLETE; INVALID_TRANSITION."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /appointments/{id}/check-out:
    post:
      tags: ["Lịch hẹn – thực hiện"]
      operationId: checkOutAppointment
      summary: Trả thú cưng lưu trú
      description: "InStay → Completed; ghi ActualCheckOut, tính phí trả muộn (BR-22), giải phóng chuồng. Có phí phạt chưa thanh toán → 409 PAYMENT_NOT_DUE."
      x-roles: [LT, QL]
      x-fr: [FR-HTL-09]
      parameters:
        - { $ref: '#/components/parameters/AppointmentId' }
      responses:
        '200':
          description: "status = Completed."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckOutResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "PAYMENT_NOT_DUE (phí phạt chưa thanh toán); INVALID_TRANSITION."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /appointments/{id}/photos:
    post:
      tags: ["Lịch hẹn – thực hiện"]
      operationId: uploadPhoto
      summary: Tải ảnh minh chứng trước/sau
      description: "Chỉ tệp ảnh, tối đa 50 MB. Ảnh Before khi lịch Received; ảnh After khi lịch InProgress. Ảnh lưu ở Supabase Storage (bucket riêng tư), CSDL chỉ lưu StorageKey."
      x-roles: ["NVS (được phân công)"]
      x-fr: [FR-EXE-09]
      parameters:
        - { $ref: '#/components/parameters/AppointmentId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/PhotoUploadRequest' }
      responses:
        '201':
          description: Đã tải lên.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "INVALID_TRANSITION — lịch không ở Received (ảnh Before) hoặc InProgress (ảnh After)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    get:
      tags: ["Lịch hẹn – thực hiện"]
      operationId: listPhotos
      summary: Xem ảnh minh chứng
      description: Kiểm tra phạm vi (BR-16) rồi trả URL tạm thời.
      x-roles: ["KH (của mình)", "NVS (được phân công)", QL]
      x-fr: [FR-EXE-09]
      parameters:
        - { $ref: '#/components/parameters/AppointmentId' }
      responses:
        '200':
          description: Danh sách ảnh.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Photo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ───────────── Thanh toán ─────────────
  /appointments/{id}/payments:
    get:
      tags: ["Thanh toán"]
      operationId: listAppointmentPayments
      summary: Các khoản thanh toán của một lịch hẹn
      description: "Spa có 1 khoản (Spa); lưu trú tối đa 2 khoản (Stay, LateFee). Kiểm tra phạm vi (BR-16)."
      x-roles: [KH, LT, NVS, QL]
      x-fr: [FR-PAY-04]
      parameters:
        - { $ref: '#/components/parameters/AppointmentId' }
      responses:
        '200':
          description: Các khoản thanh toán.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments:
    get:
      tags: ["Thanh toán"]
      operationId: listPayments
      summary: Tình hình thanh toán toàn cửa hàng
      x-roles: [QL]
      x-fr: [FR-PAY-04]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PaymentStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: Danh sách phân trang.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /payments/{id}/counter:
    post:
      tags: ["Thanh toán"]
      operationId: payAtCounter
      summary: Ghi nhận thanh toán tại quầy
      description: "Đúng thời điểm theo BR-07 và `receivedAmount` ≥ Amount (BR-17). Số tiền phải trả do hệ thống tính (FR-PAY-01), không nhận từ client. Khoản Stay: lịch không có yêu cầu xác nhận chi phí đang Pending (FR-EXE-10)."
      x-roles: [LT, QL]
      x-fr: [FR-PAY-02]
      parameters:
        - { $ref: '#/components/parameters/PaymentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CounterPaymentRequest' }
      responses:
        '200':
          description: "status = Paid."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentStatusResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "PAYMENT_NOT_DUE (sai thời điểm theo BR-07); AMOUNT_MISMATCH (số tiền nhận thấp hơn phải trả); COST_CONFIRMATION_PENDING (khoản Stay khi lịch đang chờ xác nhận chi phí mới – FR-EXE-10)."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /payments/{id}/online:
    post:
      tags: ["Thanh toán"]
      operationId: payOnline
      summary: Khởi tạo thanh toán trực tuyến
      description: "Chỉ lịch spa Completed, Payment Unpaid, thuộc KH (BR-09, BR-16). Tạo PaymentTransaction với TxnRef duy nhất, RequestedAmount = Payment.Amount. Kết quả cuối do webhook của cổng quyết định; web đọc trạng thái bằng GET /appointments/{id}/payments."
      x-roles: ["KH (của mình)"]
      x-fr: [FR-PAY-03]
      parameters:
        - { $ref: '#/components/parameters/PaymentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnlinePaymentRequest' }
      responses:
        '200':
          description: Địa chỉ chuyển khách sang cổng thanh toán.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnlinePaymentCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "PAYMENT_NOT_DUE."
          content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  /payments/ipn/vnpay:
    get:
      tags: ["Thanh toán"]
      operationId: vnpayIpn
      summary: Webhook VNPAY (IPN)
      description: "Không dùng JWT. Xác minh chữ ký bằng secret của cổng → khóa Payment, bỏ qua nếu TxnRef đã xử lý → đối chiếu số tiền với Amount (BR-17) → Paid (Method = Online). Tham số và phản hồi theo đặc tả VNPAY sandbox (R-05)."
      security: []
      x-roles: ["Ẩn danh + chữ ký cổng"]
      x-fr: [FR-PAY-03]
      parameters:
        - name: gatewayParams
          in: query
          required: true
          description: Toàn bộ tham số và chữ ký do VNPAY gửi (query string).
          style: form
          explode: true
          schema: { type: object, additionalProperties: { type: string } }
      responses:
        '200': { description: Phản hồi theo đặc tả của cổng. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /payments/ipn/momo:
    post:
      tags: ["Thanh toán"]
      operationId: momoIpn
      summary: Webhook MoMo (IPN)
      description: "Không dùng JWT. Xử lý như webhook VNPAY. Nội dung JSON và phản hồi theo đặc tả MoMo sandbox (R-05)."
      security: []
      x-roles: ["Ẩn danh + chữ ký cổng"]
      x-fr: [FR-PAY-03]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Phản hồi theo đặc tả của cổng. }
        '401': { $ref: '#/components/responses/Unauthorized' }
