      description: "Kiểm tra khoảng hợp lệ; có hiệu lực ngay cho thao tác sau, lịch hẹn đã tạo giữ giá trị đã chốt. Ngưỡng kích cỡ phải tăng dần, dung sai ≥ 0. Gửi phần nào thì cập nhật phần đó. Dạng body 3 phần là đề xuất (SA ghi `{ key: value… }`)."
      x-roles: [QL]
      x-fr: [FR-CFG-01]
      x-proposal: true
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Config' }
      responses:
        '200': { description: Đã cập nhật. }
