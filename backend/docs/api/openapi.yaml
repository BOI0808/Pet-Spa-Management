      tags: ["Thông báo"]
      operationId: markNotificationRead
      summary: Đánh dấu đã đọc
      x-roles: [KH, NVS]
      x-fr: [FR-NOT-01, FR-NOT-02, FR-NOT-03, FR-NOT-04, FR-NOT-05, FR-NOT-06]
      parameters:
        - { $ref: '#/components/parameters/NotificationId' }
      responses:
        '204': { description: Đã đánh dấu. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authorization: Bearer <accessToken>. Token chứa UserId và Role (Customer | Staff | Manager); StaffRole lấy từ dữ liệu Staff."
    jobSecret:
      type: apiKey
      in: header
      name: X-Job-Secret
      description: "Giá trị biến môi trường Jobs__Secret; sai → 401."
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1 }
    AppointmentId:
      name: id
      in: path
      required: true
      description: Mã lịch hẹn (AppointmentId).
      schema: { type: string, format: uuid }
    CustomerId:
      name: id
      in: path
      required: true
      description: Mã khách hàng (CustomerId).
      schema: { type: string, format: uuid }
    PetId:
      name: id
      in: path
      required: true
      description: Mã thú cưng (PetId).
      schema: { type: string, format: uuid }
    ServiceId:
      name: id
      in: path
      required: true
      description: Mã dịch vụ (ServiceId).
      schema: { type: string, format: uuid }
    ServiceIdPath:
      name: serviceId
      in: path
      required: true
      description: Mã dịch vụ trong lịch hẹn (ServiceId).
      schema: { type: string, format: uuid }
    PaymentId:
      name: id
      in: path
      required: true
      description: Mã khoản thanh toán (PaymentId).
      schema: { type: string, format: uuid }
    CageId:
      name: id
      in: path
      required: true
      description: Mã chuồng (CageId).
      schema: { type: string, format: uuid }
    ShiftId:
      name: id
      in: path
      required: true
      description: Mã ca làm (ShiftId).
      schema: { type: string, format: uuid }
    StaffId:
      name: id
      in: path
      required: true
      description: Mã nhân viên (StaffId).
      schema: { type: string, format: uuid }
    NotificationId:
      name: id
      in: path
      required: true
      description: Mã thông báo (NotificationId).
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: "400 VALIDATION_ERROR — dữ liệu không hợp lệ."
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Unauthorized:
      description: "401 UNAUTHENTICATED — thiếu/sai/hết hạn token; đăng nhập sai; tài khoản bị vô hiệu hóa; webhook sai chữ ký; X-Job-Secret sai."
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    Forbidden:
      description: "403 FORBIDDEN — sai vai trò hoặc ngoài phạm vi sở hữu (BR-16); không trả thông tin."
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    NotFound:
      description: "404 NOT_FOUND."
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
    RateLimited:
      description: "429 RATE_LIMITED — vượt giới hạn tần suất."
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  schemas:
    # ── Lỗi, phân trang ──
    ProblemDetails:
      type: object
      required: [status, code, title, detail]
      properties:
        status: { type: integer, example: 409 }
        code: { $ref: '#/components/schemas/ErrorCode' }
        title: { type: string, example: Khung giờ đã kín }
        detail: { type: string, example: Vui lòng chọn khung giờ khác. }
    ErrorCode:
      type: string
      description: |
        Mã lỗi nghiệp vụ (SA 5.1.2). HTTP: 400 VALIDATION_ERROR · 401 UNAUTHENTICATED · 403 FORBIDDEN, BOOKING_LOCKED · 404 NOT_FOUND ·
        409 DUPLICATE_CONTACT, SLOT_FULL, NO_CAPACITY, STAFF_CONFLICT, CAGE_CONFLICT, INVALID_TRANSITION, CHANGE_WINDOW_CLOSED, PHOTO_REQUIRED, SERVICES_INCOMPLETE, STAFF_COUNT_MISMATCH, SHIFT_OVERLAP, SHIFT_HAS_APPOINTMENTS, COST_CONFIRMATION_PENDING, PAYMENT_NOT_DUE, AMOUNT_MISMATCH, STAFF_OUT_OF_SHIFT, CUSTOMER_NOT_LOCKED, DUPLICATE_CAGE_CODE, COST_CONFIRMATION_EXPIRED (3 mã sau là đề xuất, cần thêm vào SA 5.1.2) · 429 RATE_LIMITED.
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - BOOKING_LOCKED
        - NOT_FOUND
        - DUPLICATE_CONTACT
        - SLOT_FULL
        - NO_CAPACITY
        - STAFF_CONFLICT
        - CAGE_CONFLICT
        - INVALID_TRANSITION
        - CHANGE_WINDOW_CLOSED
        - PHOTO_REQUIRED
        - SERVICES_INCOMPLETE
        - STAFF_COUNT_MISMATCH
        - SHIFT_OVERLAP
        - SHIFT_HAS_APPOINTMENTS
        - COST_CONFIRMATION_PENDING
        - PAYMENT_NOT_DUE
        - AMOUNT_MISMATCH
        - STAFF_OUT_OF_SHIFT
        - CUSTOMER_NOT_LOCKED
        - DUPLICATE_CAGE_CODE
        - COST_CONFIRMATION_EXPIRED
        - RATE_LIMITED
    PageInfo:
      type: object
      required: [page, pageSize, total]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    # ── Enum dùng chung ──
    Role: { type: string, enum: [Customer, Staff, Manager] }
    StaffRole: { type: string, enum: [Receptionist, SpaStaff] }
    Species: { type: string, enum: [Dog, Cat, Rabbit, GuineaPig] }
    SizeGroup: { type: string, enum: [Small, Medium, Large] }
    Temperament: { type: string, enum: [Calm, Normal, Difficult], description: "Difficult ⇒ lịch spa cần tối thiểu 2 nhân viên." }
    AppointmentType: { type: string, enum: [Spa, Hotel] }
    AppointmentStatus:
      type: string
      enum: [Pending, Confirmed, Received, InProgress, InStay, Completed, Cancelled]
      description: "Received, InProgress chỉ lịch Spa; InStay chỉ lịch Hotel (BR-14)."
    CancelReason:
      type: string
      enum: [CustomerCancelled, StoreUnable, CustomerBeyondDeadline, NoShow, CostNotConfirmed]
    ManagerCancelReason:
      type: string
      enum: [StoreUnable, CustomerBeyondDeadline]
      description: Lý do duy nhất client được gửi (chỉ QL); các lý do khác do backend đặt.
    PaymentKind: { type: string, enum: [Spa, Stay, LateFee] }
    PaymentStatus: { type: string, enum: [Unpaid, Paid] }
    PaymentMethod: { type: string, enum: [Cash, BankQR, Online] }
    CounterPaymentMethod: { type: string, enum: [Cash, BankQR] }
    Gateway: { type: string, enum: [VNPAY, MoMo] }
    PhotoKind: { type: string, enum: [Before, After] }
    NotificationType:
      type: string
      enum: [BookingReceived, ConfirmedAssigned, StatusChanged, Cancelled, PaymentRecorded, CostConfirmation]
    WeightCheckResult: { type: string, enum: [OK, PRICE_DECREASED, NEEDS_CONFIRMATION] }
    SlotStatus:
      type: string
      enum: [Available, Full, NotAccepted]
      description: "NotAccepted: muộn hơn mốc bắt đầu muộn nhất của dịch vụ."
    CostConfirmationStatus: { type: string, enum: [Pending, Accepted, Rejected, Expired] }
    # ── Xác thực & tài khoản ──
    RegisterRequest:
      type: object
      required: [userName, fullName, password]
      properties:
        userName: { type: string, maxLength: 20, description: Số điện thoại; được chuẩn hóa. }
        fullName: { type: string, maxLength: 150 }
        password: { type: string, format: password }
        email: { type: string, maxLength: 150 }
    RegisterResponse:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
    LoginRequest:
      type: object
      required: [userName, password]
      properties:
        userName: { type: string, description: Số điện thoại. }
        password: { type: string, format: password }
    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string, description: JWT, mặc định 15 phút (Jwt__AccessTokenMinutes). }
        refreshToken: { type: string, description: Mặc định 7 ngày (Jwt__RefreshTokenDays); lưu băm ở backend. }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    Me:
      type: object
      required: [userId, userName, role]
      properties:
        userId: { type: string, format: uuid }
        userName: { type: string, description: Số điện thoại. }
        role: { $ref: '#/components/schemas/Role' }
        staffRole:
          allOf: [{ $ref: '#/components/schemas/StaffRole' }]
          nullable: true
          description: Chỉ có khi role = Staff.
        fullName: { type: string, nullable: true }
        phone: { type: string, nullable: true, description: "Khách hàng: Customer.Phone (= userName)." }
        email: { type: string, nullable: true }
    UpdateMeRequest:
      type: object
      properties:
        fullName: { type: string, maxLength: 150 }
        phone: { type: string, maxLength: 20 }
        email: { type: string, maxLength: 150 }
    # ── Khách hàng ──
    Customer:
      type: object
      required: [customerId, fullName, phone, isBookingLocked]
      properties:
        customerId: { type: string, format: uuid }
        fullName: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        isBookingLocked: { type: boolean }
    CustomerPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Customer' } }
    WalkInRequest:
      type: object
      required: [fullName, phone]
      properties:
        fullName: { type: string, maxLength: 150 }
        phone: { type: string, maxLength: 20 }
    WalkInCreated:
      type: object
      required: [customerId]
      properties:
        customerId: { type: string, format: uuid }
    # ── Thú cưng ──
    Pet:
      type: object
      required: [petId, customerId, name, species, breed, temperament, weightKg, sizeGroup, isActive]
      properties:
        petId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        name: { type: string }
        species: { $ref: '#/components/schemas/Species' }
        breed: { type: string }
        temperament: { $ref: '#/components/schemas/Temperament' }
        weightKg: { type: number }
        heightCm: { type: number, nullable: true }
        coatNote: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        sizeGroup: { $ref: '#/components/schemas/SizeGroup' }
        isActive: { type: boolean }
    PetPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Pet' } }
    PetRequest:
      type: object
      description: "Không có `sizeGroup` (hệ thống xác định, nếu gửi sẽ bị bỏ qua)."
      required: [name, species, breed, weightKg]
      properties:
        name: { type: string, maxLength: 100 }
        species: { $ref: '#/components/schemas/Species' }
        breed: { type: string, maxLength: 100 }
        temperament: { $ref: '#/components/schemas/Temperament' }
        weightKg: { type: number, minimum: 0, exclusiveMinimum: true }
        heightCm: { type: number, description: Bắt buộc khi species = Dog. }
        coatNote: { type: string, maxLength: 255 }
        notes: { type: string }
        customerId: { type: string, format: uuid, description: Bắt buộc với LT; KH bỏ qua. }
    PetSizeResult:
      type: object
      required: [sizeGroup]
      properties:
        petId: { type: string, format: uuid, description: Chỉ có ở phản hồi tạo hồ sơ. }
        sizeGroup: { $ref: '#/components/schemas/SizeGroup' }
    # ── Danh mục dịch vụ ──
    PricingRow:
      type: object
      required: [species, sizeGroup, price, durationMinutes, staffRequired]
      properties:
        species: { $ref: '#/components/schemas/Species' }
        sizeGroup: { $ref: '#/components/schemas/SizeGroup' }
        price: { type: integer, minimum: 0, description: VND. }
        durationMinutes: { type: integer, minimum: 1 }
        staffRequired: { type: integer, enum: [1, 2] }
    Service:
      type: object
      required: [serviceId, name, latestStartTime, isActive, pricing]
      properties:
        serviceId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        latestStartTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: "18:00" }
        isActive: { type: boolean }
        pricing: { type: array, items: { $ref: '#/components/schemas/PricingRow' } }
    ServiceRequest:
      type: object
      required: [name, latestStartTime, pricing]
      properties:
        name: { type: string, maxLength: 150 }
        description: { type: string }
        latestStartTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: "18:00", description: Thuộc danh sách Booking.SlotTimes. }
        pricing:
          type: array
          minItems: 1
          description: "Đủ mọi nhóm kích cỡ của từng loài áp dụng (chuột lang chỉ Small, Large)."
          items: { $ref: '#/components/schemas/PricingRow' }
    ServiceCreated:
      type: object
      required: [serviceId]
      properties:
        serviceId: { type: string, format: uuid }
    ActiveToggleRequest:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
    # ── Đặt lịch ──
    SlotInfo:
      type: object
      required: [time, group, status]
      properties:
        time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: "09:00" }
        group: { type: string, example: Morning, description: "Nhóm Sáng / Trưa / Chiều-tối; SA chỉ minh họa Morning, Evening." }
        status: { $ref: '#/components/schemas/SlotStatus' }
    SpaSlots:
      type: object
      required: [durationMinutes, staffRequired, bufferMinutes, slots]
      properties:
        durationMinutes: { type: integer }
        staffRequired: { type: integer, enum: [1, 2] }
        bufferMinutes: { type: integer }
        slots: { type: array, items: { $ref: '#/components/schemas/SlotInfo' } }
    SpaBookingRequest:
      type: object
      required: [petId, serviceIds, slotStart]
      properties:
        petId: { type: string, format: uuid }
        serviceIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        slotStart: { type: string, format: date-time, example: "2026-10-06T09:00:00+07:00" }
        customerId: { type: string, format: uuid, description: Bắt buộc với LT đặt thay; KH bỏ qua. }
    SpaBookingCreated:
      type: object
      required: [appointmentId, status, slotEnd, staffRequired, estimatedAmount]
      properties:
        appointmentId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/AppointmentType' }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        sizeGroup: { $ref: '#/components/schemas/SizeGroup' }
        slotStart: { type: string, format: date-time }
        slotEnd: { type: string, format: date-time }
        staffRequired: { type: integer, enum: [1, 2] }
        estimatedAmount: { type: integer, description: VND. }
    HotelAvailability:
      type: object
      required: [available, nights, estimatedAmount]
      properties:
        available: { type: boolean }
        nights: { type: integer }
        estimatedAmount: { type: integer, description: VND. }
    HotelBookingRequest:
      type: object
      required: [petId, plannedCheckIn, plannedCheckOut]
      properties:
        petId: { type: string, format: uuid }
        plannedCheckIn: { type: string, format: date-time }
        plannedCheckOut: { type: string, format: date-time, description: Phải sau ngày nhận. }
        customerId: { type: string, format: uuid, description: Bắt buộc với LT đặt thay; KH bỏ qua. }
    HotelBookingCreated:
      type: object
      required: [appointmentId, status, nights, estimatedAmount]
      properties:
        appointmentId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        nights: { type: integer }
        estimatedAmount: { type: integer, description: VND. }
    # ── Lịch hẹn ──
    Appointment:
      type: object
      required: [appointmentId, type, customerId, petId, status, sizeGroup, createdAt, updatedAt]
      properties:
        appointmentId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/AppointmentType' }
        customerId: { type: string, format: uuid }
        petId: { type: string, format: uuid }
        customerName: { type: string, description: "Họ tên khách hàng (đề xuất, để hiển thị danh sách)." }
        petName: { type: string, description: "Tên thú cưng (đề xuất, để hiển thị danh sách)." }
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        cancelReason:
          allOf: [{ $ref: '#/components/schemas/CancelReason' }]
          nullable: true
          description: Có giá trị ⇔ status = Cancelled.
        cancelledAt: { type: string, format: date-time, nullable: true }
        sizeGroup: { $ref: '#/components/schemas/SizeGroup' }
        actualWeightKg: { type: number, nullable: true }
        slotStart: { type: string, format: date-time, nullable: true, description: Chỉ lịch Spa. }
        slotEnd: { type: string, format: date-time, nullable: true, description: Chỉ lịch Spa. }
        staffRequired: { type: integer, enum: [1, 2], nullable: true, description: Chỉ lịch Spa. }
        plannedCheckIn: { type: string, format: date-time, nullable: true, description: Chỉ lịch Hotel. }
        plannedCheckOut: { type: string, format: date-time, nullable: true, description: Chỉ lịch Hotel. }
        actualCheckOut: { type: string, format: date-time, nullable: true, description: Chỉ lịch Hotel. }
        cageId: { type: string, format: uuid, nullable: true, description: Chỉ lịch Hotel. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AppointmentPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Appointment' } }
    AppointmentServiceItem:
      type: object
      required: [serviceId, isDone]
      properties:
        serviceId: { type: string, format: uuid }
        name: { type: string, description: "Tên dịch vụ (đề xuất)." }
        isDone: { type: boolean }
        doneAt: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
    AppointmentStaffItem:
      type: object
      required: [staffId, isHolding]
      properties:
        staffId: { type: string, format: uuid }
        fullName: { type: string, description: "Họ tên nhân viên (đề xuất)." }
        isHolding: { type: boolean }
        assignedAt: { type: string, format: date-time }
    CostConfirmation:
      type: object
      required: [actualWeightKg, newSizeGroup, oldAmount, newAmount, status, expiresAt]
      properties:
        actualWeightKg: { type: number }
        newSizeGroup: { $ref: '#/components/schemas/SizeGroup' }
        oldAmount: { type: integer }
        newAmount: { type: integer }
        status: { $ref: '#/components/schemas/CostConfirmationStatus' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time, nullable: true }
    AppointmentDetail:
      allOf:
        - $ref: '#/components/schemas/Appointment'
        - type: object
          properties:
            services:
              type: array
              description: Chỉ lịch Spa.
              items: { $ref: '#/components/schemas/AppointmentServiceItem' }
            staff:
              type: array
              description: Chỉ lịch Spa; rỗng khi chưa xác nhận.
              items: { $ref: '#/components/schemas/AppointmentStaffItem' }
            pendingCostConfirmation:
              allOf: [{ $ref: '#/components/schemas/CostConfirmation' }]
              nullable: true
              description: Yêu cầu xác nhận chi phí đang Pending (tối đa một mỗi lịch).
    UpdateAppointmentRequest:
      type: object
      description: "Spa: slotStart, petId, serviceIds. Lưu trú: plannedCheckIn, plannedCheckOut, petId. Không có status, amount. `staffIds`, `cageId`, `confirmOutOfShift` chỉ QL gửi, KH gửi thì bị bỏ qua (đề xuất)."
      properties:
        slotStart: { type: string, format: date-time }
        plannedCheckIn: { type: string, format: date-time }
        plannedCheckOut: { type: string, format: date-time }
        petId: { type: string, format: uuid }
        serviceIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        staffIds: { type: array, minItems: 1, maxItems: 2, items: { type: string, format: uuid }, x-proposal: true, description: "Chỉ QL, lịch spa: đổi nhân viên phụ trách; đủ số nhân viên cần." }
        cageId: { type: string, format: uuid, x-proposal: true, description: "Chỉ QL, lịch lưu trú: đổi chuồng." }
        confirmOutOfShift: { type: boolean, x-proposal: true, description: "Chỉ QL: true để xác nhận nhân viên ngoài ca." }
    StatusResult:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AppointmentStatus' }
    RejectResult:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [Cancelled] }
        reason: { type: string, enum: [StoreUnable] }
    CancelRequest:
      type: object
      description: "KH không gửi `reason`; QL gửi `reason`."
      properties:
        reason: { $ref: '#/components/schemas/ManagerCancelReason' }
    StaffSuggestion:
      type: object
      required: [staffId, fullName]
      properties:
        staffId: { type: string, format: uuid }
        fullName: { type: string }
        recentAssignmentCount: { type: integer, description: Số lịch được phân công trong Suggest.LookbackDays ngày gần nhất. }
    SpaSuggestions:
      type: object
      required: [staffRequired, suggested, alternatives]
      properties:
        staffRequired: { type: integer, enum: [1, 2] }
        suggested: { type: array, items: { $ref: '#/components/schemas/StaffSuggestion' }, description: Đủ staffRequired người. }
        alternatives: { type: array, items: { $ref: '#/components/schemas/StaffSuggestion' } }
    HotelSuggestions:
      type: object
      required: [cage]
      properties:
        cage: { $ref: '#/components/schemas/Cage' }
    ConfirmSpaRequest:
      type: object
      required: [staffIds]
      properties:
        staffIds: { type: array, minItems: 1, maxItems: 2, items: { type: string, format: uuid }, description: Đủ số nhân viên cần của lịch hẹn. }
        confirmOutOfShift: { type: boolean, x-proposal: true, description: "Gửi true để xác nhận nhân viên chọn tay nằm ngoài ca làm (UC-12)." }
    ConfirmHotelRequest:
      type: object
      required: [cageId]
      properties:
        cageId: { type: string, format: uuid }
    ActualWeightRequest:
      type: object
      required: [actualWeightKg]
      properties:
        actualWeightKg: { type: number, minimum: 0, exclusiveMinimum: true, example: 11.2 }
    WeightCheck:
      type: object
      required: [result]
      properties:
        result: { $ref: '#/components/schemas/WeightCheckResult' }
        newSizeGroup: { $ref: '#/components/schemas/SizeGroup' }
        oldAmount: { type: integer }
        newAmount: { type: integer }
        expiresAt: { type: string, format: date-time, description: Hạn phản hồi (+ CostConfirm.TimeoutMinutes); khi result = NEEDS_CONFIRMATION. }
    CheckInResult:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        weightCheck: { $ref: '#/components/schemas/WeightCheck' }
    WeightCheckResponse:
      type: object
      required: [weightCheck]
      properties:
        weightCheck: { $ref: '#/components/schemas/WeightCheck' }
    CostConfirmationRespondRequest:
      type: object
      required: [accept]
      properties:
        accept: { type: boolean }
    ServiceProgressRequest:
      type: object
      required: [isDone]
      properties:
        isDone: { type: boolean }
        note: { type: string }
    CheckOutResult:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/AppointmentStatus' }
        lateFee: { type: integer, description: Phí phạt trả muộn (VND), nếu có. }
    PhotoUploadRequest:
      type: object
      required: [kind, file]
      properties:
        kind: { $ref: '#/components/schemas/PhotoKind' }
        file: { type: string, format: binary }
    PhotoCreated:
      type: object
      required: [photoId]
      properties:
        photoId: { type: string, format: uuid }
    Photo:
      type: object
      required: [photoId, kind, url, uploadedAt]
      properties:
        photoId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/PhotoKind' }
        url: { type: string, format: uri, description: URL tạm thời. }
        uploadedAt: { type: string, format: date-time }
    # ── Thanh toán ──
    Payment:
      type: object
      required: [paymentId, appointmentId, kind, amount, status]
      properties:
        paymentId: { type: string, format: uuid }
        appointmentId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/PaymentKind' }
        amount: { type: integer, minimum: 0, description: Số tiền phải trả (VND), do hệ thống tính. }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        method:
          allOf: [{ $ref: '#/components/schemas/PaymentMethod' }]
          nullable: true
        receivedAmount: { type: integer, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
    PaymentPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Payment' } }
    CounterPaymentRequest:
      type: object
      required: [method, receivedAmount]
      properties:
        method: { $ref: '#/components/schemas/CounterPaymentMethod' }
        receivedAmount: { type: integer, minimum: 0, description: Số tiền thực nhận (VND); phải ≥ Amount. }
    PaymentStatusResult:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/PaymentStatus' }
    OnlinePaymentRequest:
      type: object
      required: [gateway]
      properties:
        gateway: { $ref: '#/components/schemas/Gateway' }
    OnlinePaymentCreated:
      type: object
      required: [paymentUrl, txnRef]
      properties:
        paymentUrl: { type: string, format: uri }
        txnRef: { type: string, maxLength: 64 }
    # ── Lưu trú ──
    HotelPricingRow:
      type: object
      required: [species, sizeGroup, pricePerNight, foodPerNight]
      properties:
        species: { $ref: '#/components/schemas/Species' }
        sizeGroup: { $ref: '#/components/schemas/SizeGroup' }
        pricePerNight: { type: integer, minimum: 0 }
        foodPerNight: { type: integer, minimum: 0 }
    HotelPricing:
      type: object
      required: [pricing, lateFeePerBlock]
      properties:
        pricing: { type: array, items: { $ref: '#/components/schemas/HotelPricingRow' } }
        lateFeePerBlock: { type: integer, minimum: 0, description: "Phí phạt mỗi lần (Hotel.LateFeePerBlock), VND." }
    CageOccupant:
      type: object
      required: [petId, petName, customerId, customerName, plannedCheckOut]
      properties:
        petId: { type: string, format: uuid }
        petName: { type: string }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        plannedCheckOut: { type: string, format: date-time }
    Cage:
      type: object
      required: [cageId, code, species, sizeGroup, isActive]
      properties:
        cageId: { type: string, format: uuid }
        code: { type: string, maxLength: 20 }
        species: { $ref: '#/components/schemas/Species' }
        sizeGroup: { $ref: '#/components/schemas/SizeGroup' }
        isActive: { type: boolean }
        occupant:
          allOf: [{ $ref: '#/components/schemas/CageOccupant' }]
          nullable: true
          description: null = chuồng trống.
    CagePage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Cage' } }
    CageCreateRequest:
      type: object
      required: [code, species, sizeGroup]
      properties:
        code: { type: string, maxLength: 20 }
        species: { $ref: '#/components/schemas/Species' }
        sizeGroup: { $ref: '#/components/schemas/SizeGroup' }
    CageUpdateRequest:
      type: object
      properties:
        code: { type: string, maxLength: 20 }
        species: { $ref: '#/components/schemas/Species' }
        sizeGroup: { $ref: '#/components/schemas/SizeGroup' }
    CageCreated:
      type: object
      required: [cageId]
      properties:
        cageId: { type: string, format: uuid }
    # ── Ca làm, cấu hình, tác vụ nền ──
    WorkShift:
      type: object
      required: [shiftId, staffId, shiftStart, shiftEnd]
      properties:
        shiftId: { type: string, format: uuid }
        staffId: { type: string, format: uuid }
        shiftStart: { type: string, format: date-time }
        shiftEnd: { type: string, format: date-time }
    WorkShiftPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/WorkShift' } }
    WorkShiftCreateRequest:
      type: object
      required: [staffId, shiftStart, shiftEnd]
      properties:
        staffId: { type: string, format: uuid }
        shiftStart: { type: string, format: date-time }
        shiftEnd: { type: string, format: date-time }
    WorkShiftUpdateRequest:
      type: object
      required: [shiftStart, shiftEnd]
      properties:
        shiftStart: { type: string, format: date-time }
        shiftEnd: { type: string, format: date-time }
    WorkShiftCreated:
      type: object
      required: [shiftId]
      properties:
        shiftId: { type: string, format: uuid }
    ConfigSettings:
      type: object
      description: "Tham số nghiệp vụ (bảng SystemConfig, SA 7.2 A). Khoảng cho phép và mặc định theo SA 7.2."
      additionalProperties: false
      properties:
        Booking.ChangeCancelDeadlineMinutes: { type: integer, minimum: 60, maximum: 120, default: 60, description: "Hạn tự đổi/hủy trước giờ hẹn (BR-08)." }
        Booking.HoldMinutes: { type: integer, minimum: 1, default: 15, description: "Thời gian giữ chỗ sau giờ hẹn (BR-08)." }
        Booking.BufferMinutes: { type: integer, minimum: 15, maximum: 20, default: 15, description: Thời gian dọn dẹp sau lịch spa. }
        Booking.SlotTimes:
          type: array
          description: "Danh sách mốc giờ HH:mm, tăng dần."
          default: ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00"]
          items: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
        Suggest.LookbackDays: { type: integer, minimum: 1, default: 30 }
        NoShow.LockThreshold: { type: integer, minimum: 1, default: 3, description: "Khóa khi vắng mặt quá ngưỡng này trong NoShow.WindowDays (BR-15)." }
        NoShow.WindowDays: { type: integer, minimum: 1, default: 30 }
        CostConfirm.TimeoutMinutes: { type: integer, minimum: 1, default: 30 }
        Hotel.LateGraceMinutes: { type: integer, minimum: 1, default: 30 }
        Hotel.LateBlockMinutes: { type: integer, minimum: 1, default: 60 }
        Photo.ValidityDays: { type: integer, minimum: 1, default: 7 }
        Hotel.LateFeePerBlock: { type: integer, minimum: 0, readOnly: true, description: "Chỉ xem; chỉnh tại PUT /hotel/pricing." }
    SizeRule:
      type: object
      required: [species, criterion, smallUpper]
      properties:
        species: { $ref: '#/components/schemas/Species' }
        criterion: { type: string, enum: [Weight, Height], description: Height chỉ dùng cho Dog. }
        smallUpper: { type: number, description: Cận trên (không gồm) của nhóm Small. }
        mediumUpper: { type: number, nullable: true, description: Cận trên (không gồm) của nhóm Medium; null = loài không có nhóm Medium (GuineaPig). }
    WeightTolerance:
      type: object
      required: [species, fromGroup, toGroup, toleranceKg]
      properties:
        species: { $ref: '#/components/schemas/Species' }
        fromGroup: { $ref: '#/components/schemas/SizeGroup' }
        toGroup: { $ref: '#/components/schemas/SizeGroup' }
        toleranceKg: { type: number, minimum: 0 }
    Config:
      type: object
      description: "GET trả đủ ba phần; PUT gửi phần nào cập nhật phần đó. Ngưỡng SizeRule phải tăng dần."
      properties:
        settings: { $ref: '#/components/schemas/ConfigSettings' }
        sizeRules: { type: array, items: { $ref: '#/components/schemas/SizeRule' } }
        weightTolerances: { type: array, items: { $ref: '#/components/schemas/WeightTolerance' } }
    JobsResult:
      type: object
      required: [processed]
      properties:
        processed: { type: integer }
    # ── Nhân viên ──
    Staff:
      type: object
      required: [staffId, userName, fullName, staffRole, isActive]
      properties:
        staffId: { type: string, format: uuid }
        userName: { type: string, description: Số điện thoại. }
        fullName: { type: string }
        staffRole: { $ref: '#/components/schemas/StaffRole' }
        isActive: { type: boolean }
    StaffPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Staff' } }
    StaffCreateRequest:
      type: object
      required: [userName, fullName, staffRole, password]
      properties:
        userName: { type: string, maxLength: 20, description: Số điện thoại. }
        fullName: { type: string, maxLength: 150 }
        staffRole: { $ref: '#/components/schemas/StaffRole' }
        password: { type: string, format: password }
    StaffUpdateRequest:
      type: object
      required: [fullName, staffRole]
      properties:
        fullName: { type: string, maxLength: 150 }
        staffRole: { $ref: '#/components/schemas/StaffRole' }
    StaffCreated:
      type: object
      required: [staffId]
      properties:
        staffId: { type: string, format: uuid }
    DeactivateResult:
      type: object
      required: [returnedToPending]
      properties:
        returnedToPending: { type: integer, description: Số lịch spa Confirmed đã về Pending. }
    # ── Thông báo ──
    Notification:
      type: object
      required: [notificationId, type, message, isRead, createdAt]
      properties:
        notificationId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        appointmentId: { type: string, format: uuid, nullable: true }
        message: { type: string, maxLength: 500 }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items, unread]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
            unread: { type: integer, description: Số thông báo chưa đọc. }
